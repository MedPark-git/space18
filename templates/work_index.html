{% extends 'base.html' %}{% block content %}<header><p class="eyebrow">업무 목차</p><h2>{{ standard }} 업무관리</h2><p>{{ standard }} 업무를 다른 기준과 분리하여 관리합니다.</p></header><section class="section-grid">{% for slug,name in sections %}<a class="card section-card" href="{{ url_for('documents', category=standard, section=slug) }}"><span class="section-number">{{ loop.index }}</span><div><h3>{{ name }}</h3><p>등록된 기록 {{ section_counts[slug] }}건</p></div><span class="arrow">→</span></a>{% endfor %}</section>{% endblock %}
