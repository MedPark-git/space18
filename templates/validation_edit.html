{% extends 'base.html' %}{% block content %}
<header class="complaint-head"><div><p class="eyebrow">{{ plan.year }} VMP · EDIT</p><h2>Validation 항목 수정</h2><p>{{ record.target_name }} · {{ record.validation_item }}</p></div><a class="button ghost" href="{{ url_for('validation_management', year=plan.year) }}">← VMP 이행현황</a></header>
<section class="card"><form method="post" class="grid-form submit-once"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Validation 유형<input name="validation_type" value="{{ record.validation_type }}" required></label><label>대상: 설비 / 공정 / 시스템<input name="target_name" value="{{ record.target_name }}" required></label><label>장비번호<input name="equipment_no" value="{{ record.equipment_no }}"></label><label>Validation 항목<input name="validation_item" value="{{ record.validation_item }}" required></label><label>실행부서<input name="department" value="{{ record.department }}"></label><label>실행주기<input name="cycle" value="{{ record.cycle }}"></label><label>계획서 번호<input name="plan_doc_no" value="{{ record.plan_doc_no }}"></label><label>보고서 번호<input name="report_doc_no" value="{{ record.report_doc_no }}"></label><label>최근 완료일<input type="date" name="last_completed_date" value="{{ record.last_completed_date or '' }}"></label><label>차기 예정일<input type="date" name="next_due_date" value="{{ record.next_due_date or '' }}"><small>변경 시 항목은 비워두세요.</small></label><label>알림 시작<select name="reminder_days">{% for days in [30,60,90,180] %}<option value="{{ days }}" {% if record.reminder_days==days %}selected{% endif %}>{{ days }}일 전</option>{% endfor %}</select></label><label>담당자<input name="owner" value="{{ record.owner }}"></label><label class="wide">비고·결과<textarea name="result_note">{{ record.result_note }}</textarea></label><div class="wide actions"><button>수정내용 저장</button><a class="button ghost" href="{{ url_for('validation_management', year=plan.year) }}">취소</a></div></form></section>
{% endblock %}
