{% extends 'base.html' %}{% block content %}<header><h2>사용자 관리</h2></header><details class="card"><summary>새 사용자 생성</summary><form method="post" class="grid-form submit-once"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>로그인 ID<input name="login_id" required></label><label>이름<input name="name" required></label><label>부서<input name="department"></label><label>직급·직책<input name="position"></label><label>권한<select name="role"><option value="viewer">조회자</option><option value="editor">편집자</option><option value="admin">관리자</option></select></label><label>임시 비밀번호<input type="password" name="temporary_password" minlength="10" required></label><button>사용자 생성</button></form></details><section class="card">{% for u in users %}<details class="user-row"><summary>{{ u.login_id }} · {{ u.name }} · {{ u.role }} · {{ '활성' if u.is_active else '비활성' }}</summary><form method="post" action="{{ url_for('update_user', user_id=u.id) }}" class="grid-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>이름<input name="name" value="{{ u.name }}" required></label><label>부서<input name="department" value="{{ u.department }}"></label><label>직급·직책<input name="position" value="{{ u.position }}"></label><label>권한<select name="role">{% for role in ['admin','editor','viewer'] %}<option value="{{ role }}" {% if u.role==role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select></label><button>정보 저장</button></form><form method="post" action="{{ url_for('reset_password', user_id=u.id) }}" class="filters"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="password" name="temporary_password" minlength="10" placeholder="새 임시 비밀번호" required><button>임시 비밀번호 발급</button></form><form method="post" action="{{ url_for('toggle_user', user_id=u.id) }}" data-confirm="사용자 상태를 변경할까요?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="small ghost">활성·비활성 전환</button></form></details>{% endfor %}</section>{% endblock %}
