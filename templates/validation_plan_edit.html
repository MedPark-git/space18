{% extends 'base.html' %}{% block content %}
<header class="complaint-head"><div><p class="eyebrow">{{ plan.year }} VMP · EDIT</p><h2>VMP 기본정보 수정</h2><p>연도별 VMP 번호, 발행일과 운영상태를 관리합니다.</p></div><a class="button ghost" href="{{ url_for('validation_management', year=plan.year) }}">← VMP 이행현황</a></header>
<section class="card"><form method="post" class="grid-form submit-once"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>연도<input value="{{ plan.year }}" disabled></label><label>VMP 번호<input name="vmp_no" value="{{ plan.vmp_no }}"></label><label class="wide">VMP 제목<input name="title" value="{{ plan.title }}" required></label><label>발행일<input type="date" name="issue_date" value="{{ plan.issue_date or '' }}"></label><label>담당자·부서<input name="owner" value="{{ plan.owner }}"></label><label>운영상태<select name="status"><option value="active" {% if plan.status=='active' %}selected{% endif %}>운영 중</option><option value="completed" {% if plan.status=='completed' %}selected{% endif %}>연도 마감</option></select></label><label class="wide">비고<textarea name="notes">{{ plan.notes }}</textarea></label><div class="wide actions"><button>VMP 정보 저장</button><a class="button ghost" href="{{ url_for('validation_management', year=plan.year) }}">취소</a></div></form></section>
{% endblock %}
