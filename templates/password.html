{% extends 'base.html' %}{% block content %}<section class="card narrow"><h2>{% if current_user.must_change_password %}최초 비밀번호 변경{% else %}비밀번호 변경{% endif %}</h2><p>영문과 숫자를 포함해 10자 이상 입력하세요.</p><form method="post" class="submit-once"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>현재 비밀번호<input type="password" name="current_password" required></label><label>새 비밀번호<input type="password" name="new_password" required minlength="10"></label><label>새 비밀번호 확인<input type="password" name="confirm_password" required minlength="10"></label><button>변경</button></form></section>{% endblock %}
