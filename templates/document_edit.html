{% extends 'base.html' %}{% block content %}<section class="card narrow"><h2>{{ document.category }} 문서 수정</h2><form method="post" class="submit-once"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>문서번호<input name="document_no" value="{{ document.document_no }}" required></label><label>문서명<input name="title" value="{{ document.title }}" required></label><label>개정번호<input name="revision" value="{{ document.revision }}" required></label><label>시행일<input type="date" name="effective_date" value="{{ document.effective_date or '' }}"></label><label>상태<select name="status">{% for v,n in [('draft','작성중'),('active','시행중'),('confirmed','확정'),('obsolete','폐기')] %}<option value="{{ v }}" {% if document.status==v %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></label><label>비고<textarea name="description">{{ document.description }}</textarea></label><button>저장</button> <a class="button ghost" href="{{ url_for('documents', category=document.category) }}">취소</a></form></section>{% endblock %}
