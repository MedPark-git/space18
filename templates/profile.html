{% extends 'base.html' %}{% block content %}<section class="card narrow"><h2>내 정보</h2><dl><dt>로그인 ID</dt><dd>{{ current_user.login_id }}</dd><dt>이름</dt><dd>{{ current_user.name }}</dd><dt>부서</dt><dd>{{ current_user.department or '-' }}</dd><dt>직급·직책</dt><dd>{{ current_user.position or '-' }}</dd><dt>권한</dt><dd>{{ current_user.role }}</dd><dt>마지막 로그인</dt><dd>{{ to_kst(current_user.last_login_at) }}</dd></dl><a class="button" href="{{ url_for('change_password') }}">비밀번호 변경</a></section>{% endblock %}
