{% extends 'base.html' %}{% block content %}
<header class="complaint-head"><div><p class="eyebrow">WORK SCHEDULE</p><h2>예정업무 수정</h2><p>등록된 업무의 구분, 일정, 알림과 담당 정보를 변경합니다.</p></div><a class="button ghost" href="{{ url_for('schedule', standard=task.standard) }}">← 목록</a></header>
<section class="card"><form method="post" class="grid-form submit-once"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>구분<select name="standard" id="schedule-standard">{% for code,label in standard_labels.items() %}<option value="{{ code }}" {% if task.standard==code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>업무분류<select name="section" id="schedule-section"></select></label><label class="wide">업무명<input name="title" required value="{{ task.title }}"></label><label>예정일<input type="date" name="due_date" required value="{{ task.due_date.isoformat() }}"></label><label>날짜 기준<select name="date_precision"><option value="day" {% if task.date_precision=='day' %}selected{% endif %}>정확한 날짜</option><option value="month" {% if task.date_precision=='month' %}selected{% endif %}>월 단위 일정</option></select></label><label>알림 시작<select name="reminder_days">{% for days in [30,60,90,180] %}<option value="{{ days }}" {% if task.reminder_days==days %}selected{% endif %}>{{ days }}일 전</option>{% endfor %}</select></label><label>담당자·부서<input name="owner" value="{{ task.owner }}"></label><label class="wide">메모<textarea name="memo">{{ task.memo }}</textarea></label><div class="wide actions"><button>수정내용 저장</button><a class="button ghost" href="{{ url_for('schedule', standard=task.standard) }}">취소</a></div></form></section>
<script>const sectionMap={{ work_sections|tojson }};const standard=document.getElementById('schedule-standard');const section=document.getElementById('schedule-section');const original={{ task.section|tojson }};function refreshSections(){const selected=section.value||original;section.innerHTML='';(sectionMap[standard.value]||[]).forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;option.selected=value===selected;section.appendChild(option);});}standard.addEventListener('change',()=>{section.value='';refreshSections();});refreshSections();</script>
{% endblock %}
